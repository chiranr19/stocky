name: Daily Digest

on:
  schedule:
    # 22:30 UTC on weekdays — after the US market close (16:00 ET / 21:00 UTC).
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

jobs:
  digest:
    name: Build and send the daily digest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Cache the DuckDB file so daily runs only fetch increments — far faster
      # and much less likely to trip Yahoo's rate limits from a CI IP.
      - name: Cache market data
        uses: actions/cache@v4
        with:
          path: backend/data
          key: stocky-duckdb-${{ github.run_id }}
          restore-keys: |
            stocky-duckdb-

      - name: Warm market data
        run: python scripts/warm_data.py

      - name: Audit data quality (report only)
        run: python scripts/audit_data.py || true

      - name: Build digest
        run: python scripts/build_digest.py

      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python scripts/send_digest.py

      - name: Upload digest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stocky-digest
          path: |
            backend/scripts/digest.html
            backend/scripts/digest.txt
          retention-days: 7
